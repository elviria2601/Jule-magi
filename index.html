<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172c3b">
  <title>Julemagi 🎅</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #172c3b; padding: 18px; }
    img { display: block; max-width: 100%; max-height: calc(100dvh - 36px); width: auto; height: auto; object-fit: contain; border-radius: 12px; box-shadow: 0 10px 36px #0006; }
  </style>
</head>
<body>
  <img src="Nisse.gif.gif" alt="En koselig animert julehilsen med nissen som ønsker god jul">
